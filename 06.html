<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>30 Jahre Jürgens Kegelmäuschen</title>
<style>
:root {
  --bg: #050505;
  --green: #9cff00;
  --muted: #d8ffd0;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--green);
  font-family: Arial, Helvetica, sans-serif;
}
body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.card {
  width: min(92vw, 760px);
  border: 3px solid var(--green);
  border-radius: 28px;
  padding: 34px 28px 30px;
  text-align: center;
  box-shadow: 0 0 0 8px rgba(156,255,0,0.06);
}
.kicker {
  font-size: clamp(15px, 3.5vw, 20px);
  letter-spacing: .16em;
  font-weight: 800;
  margin-bottom: 24px;
}
.message {
  font-size: clamp(30px, 7vw, 58px);
  line-height: 1.08;
  font-weight: 900;
  margin: 0;
}
.footer {
  margin-top: 28px;
  font-size: clamp(14px, 3vw, 18px);
  color: var(--muted);
  letter-spacing: .08em;
  font-weight: 700;
}
</style>
</head>
<body>
  <main class="card">
    <div class="kicker">SCAN ERFOLGREICH</div>
    <p class="message">Dieser QR-Code war kostenlos. Das nächste Getränk für diese Kegelmaus leider nicht.</p>
    <div class="footer">30 JAHRE JÜRGENS KEGELMÄUSCHEN</div>
  </main>
</body>
</html>
